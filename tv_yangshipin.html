<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>央视频 TV 壳</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:linear-gradient(160deg,#0a0f1e,#12203c); font-family:system-ui,"Microsoft YaHei",sans-serif; color:#e8eefc; user-select:none; }
  #wrap { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; text-align:center; padding:26px; z-index:2; }
  #wrap .big { font-size:34px; font-weight:800; letter-spacing:4px; color:#fff; }
  #wrap .big span { color:#4f7cff; }
  #wrap .sub { font-size:15px; color:#8fa3cc; letter-spacing:1px; }
  #wrap .go { display:flex; gap:18px; margin-top:8px; }
  #wrap .btn { padding:16px 40px; border-radius:14px; border:none; cursor:pointer;
    background:linear-gradient(135deg,#4f7cff,#6a5cff); color:#fff; font-size:19px; font-weight:700; letter-spacing:3px;
    box-shadow:0 8px 30px rgba(79,124,255,.35); }
  #wrap .btn:hover { filter:brightness(1.12); }
  #wrap .btn.alt { background:rgba(79,124,255,.16); border:1px solid rgba(120,160,255,.45); box-shadow:none; font-size:15px; letter-spacing:2px; padding:14px 28px; }
  #wrap .tip { font-size:13px; color:#5c719e; max-width:720px; line-height:2; margin-top:6px; }
  #wrap .tip b { color:#7d9bff; }
  #loading { position:fixed; inset:0; z-index:3; display:none; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:#0a0f1e; }
  #loading.on { display:flex; }
  #loading .sp { width:48px; height:48px; border-radius:50%; border:3px solid rgba(79,124,255,.18); border-top-color:#4f7cff; animation:sp .8s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  #loading .txt { font-size:14px; color:#8fa3cc; letter-spacing:1px; }
</style>
</head>
<body>

  <div id="wrap">
    <div class="big">央视频 <span>TV</span></div>
    <div class="sub">官方直播 · 高清稳定 · 电视遥控器适配</div>
    <div class="go">
      <button class="btn" id="btn-enter">进 入 直 播</button>
      <button class="btn alt" id="btn-frame">内嵌模式</button>
    </div>
    <div class="tip">
      ① 点「进入直播」→ 打开<b>央视频官方网页</b>，频道列表完整、画质最高。<br>
      ② 电视遥控器：<b>方向键</b>移动焦点 · <b>确认键</b>选中播放 · <b>数字键</b>直接选台。<br>
      ③ 若某频道黑屏，按遥控器【返回】回频道列表重选即可。
    </div>
  </div>

  <div id="loading"><div class="sp"></div><div class="txt">正在打开央视频官方直播…</div></div>

<script>
(function(){
  var HOME = 'https://tv.yangshipin.cn/';
  var CH = 'https://tv.yangshipin.cn/tv/home';
  var entered = false;

  function goJump(u){
    entered = true;
    var ld = document.getElementById('loading');
    ld.classList.add('on');
    window.location.href = u;
    setTimeout(function(){
      ld.querySelector('.txt').textContent = '未跳转成功，请检查浏览器设置或返回后重试';
    }, 8000);
  }

  function goFrame(){
    entered = true;
    var w = document.getElementById('wrap');
    w.style.display = 'none';
    var f = document.createElement('iframe');
    f.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;z-index:1;background:#000;';
    f.src = HOME;
    f.setAttribute('allow','autoplay; encrypted-media');
    f.setAttribute('allowfullscreen','');
    document.body.appendChild(f);
  }

  document.getElementById('btn-enter').addEventListener('click', function(){ goJump(HOME); });
  document.getElementById('btn-frame').addEventListener('click', function(){ goFrame(); });

  var btn = document.getElementById('btn-enter');
  try { btn.focus(); } catch (e) {}
  document.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goJump(HOME); }
  });

  /* 5 秒未操作自动进入 */
  setTimeout(function(){ if (!entered) { goJump(HOME); } }, 5000);
})();
</script>
</body>
</html>
