name: 每周合并上游 jar

# 【2026-11-27 已暂停自动合并】原每周二 05:10（UTC 周一 21:10）的 schedule 已移除。
# 原因：该流程会调用 update_tvbox.py 重新生成 tvbox.json / tvbox_local.json，覆盖已定版的 v67 123 站配置。
# 恢复方式：需要恢复时在 on: 下重新加入
#   schedule:
#     - cron: "10 21 * * 1"
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-jar
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 准备 JDK（smali/baksmali 要 java）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装依赖（可失败）
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install pycryptodome

      - name: 合并 jar
        run: |
          set -o pipefail
          python rebuild_jar.py --out jar/qf_spider_merged.jar 2>&1 | tee /tmp/rebuild.log
          NEW_MD5=$(grep -o 'MD5=[0-9a-f]\{32\}' /tmp/rebuild.log | tail -1 | cut -d= -f2)
          if [ -z "$NEW_MD5" ]; then echo "❌ 没拿到合并后 jar 的 md5"; exit 1; fi
          echo "NEW_MD5=$NEW_MD5" >> $GITHUB_ENV

      - name: 校验 jar
        run: |
          python - <<'PY'
          import zipfile, sys
          z = zipfile.ZipFile("jar/qf_spider_merged.jar")
          dex = z.read("classes.dex")
          for c in (b"Lcom/github/catvod/spider/QfUpdate;", b"Lcom/github/catvod/spider/QfToast;"):
              assert c in dex, f"缺少 {c}"
          print("jar 校验通过:", len(dex), "B dex")
          PY

      - name: 用新 jar 重建配置
        run: |
          python - <<'PY'
          import re, os
          p = "update_tvbox.py"
          s = open(p, encoding="utf-8").read()
          s = re.sub(r'QF_JAR_MD5 = "[0-9a-f]{32}"', 'QF_JAR_MD5 = "%s"' % os.environ["NEW_MD5"], s)
          open(p, "w", encoding="utf-8").write(s)
          print("QF_JAR_MD5 →", os.environ["NEW_MD5"])
          PY
          QF_JAR_LOCAL=jar/qf_spider_merged.jar python update_tvbox.py tvbox.json

      - name: 校验配置
        run: |
          python - <<'PY'
          import json
          d = json.load(open("tvbox.json", encoding="utf-8"))
          sites = d["sites"]
          assert len(sites) >= 60, f"站点数异常: {len(sites)}"
          t = json.load(open("tvbox_local.json", encoding="utf-8"))
          assert t["spider"] == "LOCALJAR"
          assert all(s["jar"] == "LOCALJAR" for s in t["sites"])
          print(f"校验通过: {len(sites)} 站点")
          PY

      - name: 回退保护（站点掉太多就不提交）
        run: |
          OLD=$(git show HEAD:tvbox.json | python3 -c "import json,sys;print(len(json.load(sys.stdin)['sites']))")
          NEW=$(python3 -c "import json;print(len(json.load(open('tvbox.json'))['sites']))")
          echo "站点数：上次 $OLD → 本次 $NEW"
          if [ "$NEW" -lt $((OLD - 10)) ]; then
            echo "❌ 站点数掉得太多，判定上游异常，本次保留旧 jar 与旧配置"
            git checkout -- jar/qf_spider_merged.jar update_tvbox.py tvbox.json tvbox_local.json 2>/dev/null || true
            rm -f jar/upstream_state.json
            exit 0
          fi

      - name: 提交变更
        run: |
          git config user.name "tvbox-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "每周合并上游 jar（md5 ${NEW_MD5}）$(date -u '+%Y-%m-%d')"
          git pull --rebase origin main || true
          git push || { echo "push 失败，重试一次"; git pull --rebase origin main; git push; }
